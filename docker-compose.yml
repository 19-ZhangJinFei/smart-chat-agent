services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      TZ: Asia/Shanghai
      DB_PATH: /app/data/smartchat.db
      AGENT_DB_PATH: /app/data/agent_memory.db
    expose:
      - "8000"
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [smartchat]
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${SMARTCHAT_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [smartchat]
networks:
  smartchat:
    ipam:
      config:
        - subnet: 172.29.90.0/24
